        - generic [ref=f173e530]:
          - generic [ref=f173e531]:
            - heading "How to get to your hotel" [level=3] [ref=f173e532]
            - generic [ref=f173e533]:
              - generic [ref=f173e534]: Leave the M23 at Junction 9, signposted for Gatwick Airport. Go straight through the first roundabout (signposted Redhill A23) and then at the next roundabout take the 4th exit towards Redhill A23. At the next roundabout take the first exit past the Esso service station and turn on to Povey Cross Road. The Travelodge is located on the left hand side.
              - heading "Accessibility" [level=3] [ref=f173e535]
              - paragraph [ref=f173e536]: Our accessible rooms are designed for your comfort. Please note that while rooms may be located above ground floor level, three lifts are situated nearby. If you have any questions about accessibility, please contact the hotel directly so we can assist you.
              - paragraph [ref=f173e537]: "Tel: 08719 846506"
          - generic [ref=f173e538]:
            - heading "Parking" [level=4] [ref=f173e539]
            - generic [ref=f173e541]:
              - paragraph [ref=f173e542]: This car park is operated by Horizon Parking on behalf of Travelodge.
              - paragraph [ref=f173e543]: Due to the popularity of the hotel, guests are advised to leave ample time for parking in the hotel car park and spaces are available on a first come, first served basis.
              - paragraph [ref=f173e544]: HGVs and coaches can park with the hotel manager's permission.
              - paragraph [ref=f173e545]: "Seasonal parking charges:"
              - paragraph [ref=f173e546]: £11.00 per 24 hours for guests (October - March)
              - paragraph [ref=f173e547]: £15.00 per 24 hours for guests (April - September)
              - paragraph [ref=f173e548]: Pay for parking at the car park pay and display machine, via QR Code, phone, Horizon website or Horizon parking app.
              - paragraph [ref=f173e549]: This car park is managed with Automatic Number Plate Recognition cameras. Please provide your vehicle registration number when paying for your parking and register your vehicle at the tablet in reception to validate the resident parking fee.
              - paragraph [ref=f173e550]: Blue Badge holders are exempt from charges. Please make the reception team aware of your Blue Badge and registration details when checking in. Please display your Blue Badge when parked in an accessible bay to avoid receiving a parking charge.
              - paragraph [ref=f173e551]: It is possible to pay for a maximum stay of 5 nights but this does not guarantee a space on arrival or if you leave the car park during your stay. Please note, long-term park-and-fly is not permitted for airport travellers.
        - generic [ref=f173e554]:
          - generic [ref=f173e555]:
            - heading "About this hotel" [level=2] [ref=f173e556]
            - paragraph [ref=f173e557]: Gatwick Airport Central is the ideal hotel for an overnight stay before an early flight. Its prime location and plentiful parking makes it convenient for getting to Gatwick Airport.
            - paragraph [ref=f173e558]: If you have some time to spare, enjoy a South East adventure in the beautiful county of Sussex. Explore 700 years of history at Hever Castle, once home to Anne Boleyn, visit the family home of Sir Winston Churchill at Chartwell House or the British Wildlife Centre with over 40 species of UK wildlife from red deer, owls, otters and wildcats. All of these attractions are within a 30 minute drive from the hotel.
            - paragraph [ref=f173e559]:
              - strong [ref=f173e560]: Standard Double Rooms
            - paragraph [ref=f173e561]: Unwind in a comfy king size Travelodge Dreamer® bed, complete with four pillows and a cosy duvet for a great night's sleep.
            - paragraph [ref=f173e562]:
              - strong [ref=f173e563]: NEW Travelodge SuperRooms®
            - paragraph [ref=f173e564]:
              - text: We’ve enhanced everything guests love about our
              - strong [ref=f173e565]: SuperRooms™
              - text: with a fresh new design focused on comfort and rest.
            - paragraph [ref=f173e566]:
              - text: Our
              - strong [ref=f173e567]: NEW Travelodge SuperRooms®
              - text: still include everything our guests love, but now with more! Premium WiFi is included, along with a larger 43″ Samsung 4K LED TV and a convenient in-room drinks fridge (5-8℃) with a complimentary still and sparkling water. Plus an invigorating Hansgrohe Raindance 3-jet shower, an in-room Lavazza coffee machine, blackout curtains, mood lighting and hypoallergenic pillows.
              - strong [ref=f173e568]: Travelodge SuperRooms®
              - text: ", are the perfect choice with added comforts."
            - paragraph [ref=f173e569]:
              - strong [ref=f173e570]: Bar Café
            - paragraph [ref=f173e571]: Our Bar Café is on-site and ready when you are. Pop in for our Unlimited Breakfast, tasty evening meals, or just a relaxing drink. It’s a brilliant spot to switch off, get some work done, or hang out with friends and family. Travelling with little ones? Kids eat breakfast for £1 at Travelodge. For every full-paying adult, up to two children under 15 years old get breakfast for £1 each.
            - paragraph [ref=f173e572]:
              - text: View all
              - link "airport hotels" [ref=f173e573] [cursor=pointer]:
                - /url: https://www.travelodge.co.uk/about/airport-hotels/
              - link "." [ref=f173e574] [cursor=pointer]:
                - /url: http://www.travelodge.co.uk/uk/gatwick-airport-hotels
          - generic [ref=f173e575]:
            - heading "Useful information" [level=3] [ref=f173e576]
            - paragraph [ref=f173e577]:
              - strong [ref=f173e578]: We think you’ll love the contemporary décor of our new design rooms, featuring our signature king size Travelodge Dreamer® bed, blackout curtains, bedside USB charging points, and a spacious desk. Complimentary tea and coffee making facilities and hand, hair & body wash are also included.
            - heading "Check-in & check-out" [level=4] [ref=f173e579]
            - paragraph [ref=f173e580]: "Standard check-in time: From 3pm.Standard check-out time: Until 12pm (noon)Early check-in and late check-out are available for an extra charge.Our hotel is staffed 24/7."
            - heading "Food & drink" [level=4] [ref=f173e581]
            - paragraph [ref=f173e582]: You don't have to go far for a great meal. Our Bar Café serves our popular Unlimited Breakfast, a selection of delicious mains, sides, and desserts for dinner, and a full bar for a relaxing drink any time.
            - paragraph [ref=f173e583]:
              - strong [ref=f173e584]: Breakfast
            - paragraph [ref=f173e585]: Start your day right with our ultimate unlimited breakfast, including fresh, whole-bean Lavazza coffee. Join us from 4:00 AM to 11:00 AM everyday. Plus, our family offer means kids eat breakfast for just £1 each (up to two children aged 15 and under per full-paying adult).
            - paragraph [ref=f173e586]:
              - strong [ref=f173e587]: Dinner
            - paragraph [ref=f173e588]: In the evenings, enjoy our light bites, delicious mains and desserts, between 5:00 PM and 12:00 AM. Plus, you can stop by for drinks any time.
            - paragraph [ref=f173e589]: Snacks & soft drinks available by the reception 24/7.
            - paragraph [ref=f173e590]:
              - strong [ref=f173e591]: NEW Choose Your Room
            - paragraph [ref=f173e592]: Great news! For selected stays, you can now use our interactive floor plan to choose your perfect room. Pick a specific view, floor (top or ground), or rooms close together with friends or family. It’s first come, first served, so book yours today! To select, visit the "Manage booking" section of our website. Charges apply.
            - heading "Other" [level=4] [ref=f173e593]
            - paragraph [ref=f173e594]: North terminal pick-up point is outside the terminal from the Pick-Up zone. South terminal pick-up point is on the ground floor in the Orange Pick Up zone. Gatwick Hoppa buses also provide a regular shuttle service to and from the airport. £5.25 per adult, £3.00 per child and a family ticket (2 adults, 2 children) is £13. South Terminal shuttles can be picked up from bus stop 9 and North Terminal shuttles from bus stop 11.
            - paragraph [ref=f173e595]: "Please note the current prices for local taxi services:"
            - paragraph [ref=f173e596]: R4 (standard 4 seater + Estate Vehicle) = £10.50 + The £5 compulsory gatwick charge = £15.50
            - paragraph [ref=f173e597]: MPV 6/8 seater = £16.00 + The £5 compulsory Gatwick Charge = £21.00
            - paragraph [ref=f173e598]:
              - strong [ref=f173e599]: Facilities
            - paragraph [ref=f173e600]: In every Travelodge room, you’ll find complimentary hair and body wash, along with coffee and tea making facilities. Cots, hair dryers, irons and ironing boards are available on request (subject to availability). Upgrade to a Travelodge SuperRoom® to find an in-room hairdryer, iron, and ironing board waiting for you.
            - paragraph [ref=f173e601]:
              - strong [ref=f173e602]: Pet-friendly rooms available
            - paragraph [ref=f173e603]: Your best friend is welcome here! Our hotels ensure a comfortable stay for every family member - including your pet companion.
            - paragraph [ref=f173e604]:
              - strong [ref=f173e605]: WiFi
            - paragraph [ref=f173e606]: Stay connected with our hotel-wide Premium WiFi by Virgin Media - available to handle everything from catching up on social media or browsing the news, to managing those vital emails.
