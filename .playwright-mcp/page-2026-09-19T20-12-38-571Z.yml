                - generic [ref=f6e487]:
                  - paragraph [ref=f6e488]: Este albergue YHA se encuentra a 5 minutos a pie de la estación de metro de Earl's Court. El establecimiento ofrece alojamientos económicos en habitaciones compartidas y privadas, recepción abierta las 24 horas, WiFi y salón de TV. El YHA London Earl's Court dispone de instalaciones independientes. La cafetería sirve un desayuno continental y una selección de aperitivos durante todo el día. También hay juegos de mesa en la recepción a disposición de los huéspedes. El establecimiento YHA Earls Court cuenta con servicios de lavandería y consigna de equipaje. El personal del complejo puede hacer recomendaciones a los huéspedes sobre lugares de interés turístico y organizar servicios de traslado. Tanto el Museo de Historia Natural como el Museo Albert & Victoria quedan a menos de 10 minutos a pie. Además, el albergue está cerca de la moderna calle de Kensington High Street y su fantástica selección de tiendas. La mayoría de las habitaciones tienen literas.
                  - paragraph [ref=f6e489]: A las parejas les encanta la ubicación — Le han puesto un 9,2 para viajes de dos personas.
