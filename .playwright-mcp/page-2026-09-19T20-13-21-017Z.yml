              - generic [ref=f11e349]:
                - paragraph [ref=f11e350]: "Alojamiento Confortable: The Private Rooms in Paddington ofrece alojamiento en habitación en Londres. Los clientes disfrutan de wifi gratuito, bañera, tetera y cafetera, mesa de comedor y vistas a una calle tranquila. Equipamiento Moderno: Cada habitación cuenta con nevera, baño compartido con artículos de aseo gratuitos, ducha, zona de comedor, hervidor eléctrico, utensilios de cocina y armario. El establecimiento garantiza la limpieza de las habitaciones y una ubicación conveniente. Ubicación Privilegiada: Situado a 1,9 km de la estación de Paddington y a 19 minutos a pie del Lord's Cricket Ground, el alojamiento está cerca del mercado de Portobello y de Madame Tussauds. El aeropuerto de Londres City se encuentra a 20 km. En los alrededores se puede practicar navegación. Satisfacción del Cliente: Altamente valorado por la limpieza de las habitaciones, la cocina y la ubicación conveniente."
