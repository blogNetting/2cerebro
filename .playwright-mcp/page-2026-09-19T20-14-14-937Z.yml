        - generic [ref=f15e4732]:
          - heading "Gestionar la configuración de las cookies" [level=2] [ref=f15e4733]
          - generic [ref=f15e4734]:
            - paragraph [ref=f15e4735]: "Cuando utilizas Booking.com, nosotros (Booking.com y nuestros colaboradores) usamos las siguientes categorías de cookies (y tecnologías similares) que requieren tu consentimiento: cookies analíticas y cookies de marketing."
            - heading "Cookies analíticas" [level=3] [ref=f15e4736]
            - paragraph [ref=f15e4737]: Tanto nosotros como nuestros colaboradores usamos cookies analíticas para obtener información del uso que haces de nuestro servicio, lo que a su vez se utiliza para comprender la manera en que se usa nuestra plataforma y para mejorar el rendimiento de nuestro sitio y nuestros servicios.
            - heading "Cookies de marketing" [level=3] [ref=f15e4738]
            - paragraph [ref=f15e4739]: Nosotros y nuestros colaboradores utilizamos cookies de marketing, incluidas las de redes sociales, para recopilar información sobre tu comportamiento en esta plataforma, lo que nos ayuda a decidir qué productos mostrarte dentro y fuera de ella, y para mostrar contenido y anuncios personalizados en Booking.com y otras plataformas. El contenido personalizado se basa en tu comportamiento y en los servicios que hayas reservado. Estas cookies también te permiten compartir páginas en redes sociales o darles a "me gusta".
            - paragraph [ref=f15e4740]: Al seleccionar "Aceptar", das tu consentimiento para el uso de cookies analíticas y de marketing, así como para el correspondiente tratamiento de tus datos personales. Puedes actualizar tu consentimiento para cada plataforma en cualquier momento. En el sitio web, en "Gestionar la configuración de las cookies" en el pie de página; en la aplicación, en "Mi cuenta/Iniciar sesión" > "Preferencias del dispositivo" > "Gestionar ajustes de privacidad".
            - paragraph [ref=f15e4741]: Al seleccionar "Rechazar", tendrás una experiencia menos personalizada en nuestra plataforma.
            - paragraph [ref=f15e4742]:
              - text: Puedes encontrar más información sobre el correspondiente tratamiento de los datos personales en la
              - link "Política de privacidad" [ref=f15e4743] [cursor=pointer]:
                - /url: https://www.booking.com/content/privacy.html
              - text: .
