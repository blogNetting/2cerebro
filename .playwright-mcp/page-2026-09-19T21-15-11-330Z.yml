      - generic [ref=f19e1661]:
        - generic [ref=f19e1663]:
          - heading "Gestionar la configuración de las cookies" [level=2] [ref=f19e1664]
          - generic [ref=f19e1665]:
            - paragraph [ref=f19e1666]: "Cuando utilizas Booking.com, nosotros (Booking.com y nuestros colaboradores) usamos las siguientes categorías de cookies (y tecnologías similares) que requieren tu consentimiento: cookies analíticas y cookies de marketing."
            - heading "Cookies analíticas" [level=3] [ref=f19e1667]
            - paragraph [ref=f19e1668]: Tanto nosotros como nuestros colaboradores usamos cookies analíticas para obtener información del uso que haces de nuestro servicio, lo que a su vez se utiliza para comprender la manera en que se usa nuestra plataforma y para mejorar el rendimiento de nuestro sitio y nuestros servicios.
            - heading "Cookies de marketing" [level=3] [ref=f19e1669]
            - paragraph [ref=f19e1670]: Nosotros y nuestros colaboradores utilizamos cookies de marketing, incluidas las de redes sociales, para recopilar información sobre tu comportamiento en esta plataforma, lo que nos ayuda a decidir qué productos mostrarte dentro y fuera de ella, y para mostrar contenido y anuncios personalizados en Booking.com y otras plataformas. El contenido personalizado se basa en tu comportamiento y en los servicios que hayas reservado. Estas cookies también te permiten compartir páginas en redes sociales o darles a "me gusta".
            - paragraph [ref=f19e1671]: Al seleccionar "Aceptar", das tu consentimiento para el uso de cookies analíticas y de marketing, así como para el correspondiente tratamiento de tus datos personales. Puedes actualizar tu consentimiento para cada plataforma en cualquier momento. En el sitio web, en "Gestionar la configuración de las cookies" en el pie de página; en la aplicación, en "Mi cuenta/Iniciar sesión" > "Preferencias del dispositivo" > "Gestionar ajustes de privacidad".
            - paragraph [ref=f19e1672]: Al seleccionar "Rechazar", tendrás una experiencia menos personalizada en nuestra plataforma.
            - paragraph [ref=f19e1673]:
              - text: Puedes encontrar más información sobre el correspondiente tratamiento de los datos personales en la
              - link "Política de privacidad" [ref=f19e1674] [cursor=pointer]:
                - /url: https://www.booking.com/content/privacy.html
              - text: .
