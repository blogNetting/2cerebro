            - generic [ref=f17e448]:
              - generic [ref=f17e452]:
                - paragraph [ref=f17e453]: Common View es un alojamiento con vistas al jardín que se encuentra en Londres, a 5,5 km de Harrods y a 5,6 km de Royal Albert Hall. Está a 5,3 km de Museo de Historia Natural de Londres y dispone de wifi gratis, además de cocina compartida. Este apartamento dispone de 1 dormitorio, cocina con nevera y microondas, TV de pantalla plana, zona de estar y 1 baño con ducha. Para mayor comodidad, el alojamiento puede ofrecer toallas y ropa de cama por un suplemento. Palacio de Buckingham está a 6,4 km del alojamiento, y Big Ben está a 6,9 km. El aeropuerto (Aeropuerto de Londres - City) está a 20 km.
                - paragraph [ref=f17e454]: A las parejas les encanta la ubicación — Le han puesto un 9,3 para viajes de dos personas.
                - paragraph [ref=f17e455]: Las distancias en la descripción del alojamiento se calculan con OpenStreetMap©
