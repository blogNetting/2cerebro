          - heading "Descripción del producto" [level=2] [ref=f3e1663]
          - paragraph [ref=f3e1665]: El convertidor de óxido de hammerite es una imprimación base agua para el tratamiento de la oxidación en superficies férricas o acero. Reacciona con el óxido para formar una capa protectora que neutraliza la oxidación superficial y sirve de base para poder aplicar un esmalte protector definitivo. Es idóneo para todo tipo de elementos de hierro o acero, desde carpintería metálica de todo tipo puertas, ventanas, barandillas, verjas, etc. Hasta pequeñas reparaciones en electrodomésticos y vehículos. Tiempo de actuación en condiciones normales de 15 a 30 minutos. Secado para poder pintar 6 horas. Cobertura de 20-25 m²/l.o conversor de óxido hammerite é um primário à base de água para o tratamento da oxidação em superfícies férricas ou aço. Reage com a ferrugem para formar uma camada protetora que neutraliza a oxidação superficial e serve como uma base para aplicar um verniz protetor definitivo. é ideal para todos os tipos de elementos de ferro ou aço, desde carpintaria metálica de todos os tipos portas, janelas, corrimões, etc. A pequenas reparações em eletrodomésticos e veículos. Tempo de atuação em condições normais de 15 a 30 minutos. Secagem para pintar 6 horas. Cobertura de 20 a 25 m²/l.
