                - paragraph [ref=f9e355]: Los descuentos Genius en este alojamiento dependen de las fechas de reserva, las fechas de estancia y otras ofertas disponibles.
                - generic [ref=f9e356]:
                  - generic [ref=f9e357]:
                    - paragraph [ref=f9e358]: "Ubicación Prime en el Centro de la Ciudad: Monopoly en Londres ofrece una ubicación conveniente, con Brick Lane a menos de 1 km, el Puente de la Torre y la Torre de Londres a 1,7 km, y el Puente de Londres a 19 minutos a pie. La estación de metro de Liverpool Street está a 8 minutos a pie, y el Aeropuerto de la Ciudad de Londres se encuentra a 10 km. Alojamientos Cómodos: El hotel cuenta con habitaciones solo para adultos con baños privados, suelos de moqueta y equipamiento moderno que incluye wifi gratuito, lavadora y escritorio. Cada habitación incluye un área de comedor, cocina y TV. Instalaciones Excepcionales: Los clientes pueden disfrutar de una terraza al sol, un área de asientos al aire libre y una cocina compartida. Otras comodidades incluyen una mesa de comedor, frigorífico, microondas y cocina de gas. Los servicios de check-in y check-out privados garantizan una llegada y salida sin complicaciones. Atracciones Cercanas: Explora Sky Garden, la Catedral de San Pablo y la estación de metro del Puente de Londres, todo dentro de 5 km. También hay opciones de navegación en la zona, y el Aeropuerto de la Ciudad de Londres está a 10 km."
                    - paragraph [ref=f9e359]: A las parejas les encanta la ubicación — Le han puesto un 8,8 para viajes de dos personas.
