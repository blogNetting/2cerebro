      - heading "Cookies y opciones de publicidad" [level=4] [ref=f5e5]
      - paragraph [ref=f5e6]:
        - text: Si das tu consentimiento, podemos utilizar tu información personal de cualquiera de estos
        - link "Servicios de Amazon" [ref=f5e7] [cursor=pointer]:
          - /url: /gp/help/customer/display.html?nodeId=T1fdzp9ecINEaVWTyY
        - text: para personalizar los anuncios que te mostramos en otros servicios y en sitios web externos. Por ejemplo, podemos usar tu historial de reproducciones de Prime Video para personalizar los anuncios que te mostramos en nuestras tiendas o en Fire TV. También podemos usar la información personal que recibimos de terceros.
      - paragraph [ref=f5e8]:
        - text: Además, si das tu consentimiento, también utilizaremos cookies para complementar tu experiencia de compra en las tiendas de Amazon, tal y como se describe en nuestro
        - link "Aviso de cookies" [ref=f5e9] [cursor=pointer]:
          - /url: /gp/help/customer/display.html?nodeId=201890250
        - text: . Tu elección se aplica al uso de cookies de publicidad propias y de terceros en este servicio. Las cookies almacenan o acceden a información estándar del dispositivo, como un identificador exclusivo. Los
        - link "129 terceros" [ref=f5e10] [cursor=pointer]:
          - /url: /privacyprefs/retail/partners
        - text: que utilizan cookies en este servicio lo hacen con el fin de mostrar y medir anuncios personalizados, generar información sobre el público, y desarrollar y mejorar productos.
      - paragraph [ref=f5e11]:
        - text: Utilizamos cookies y herramientas similares necesarias que te permiten comprar y mejorar tus experiencias de compra, y nos permiten proporcionarte nuestros servicios, como se detalla en nuestro
        - link "Aviso de cookies" [ref=f5e12] [cursor=pointer]:
          - /url: /gp/help/customer/display.html?nodeId=201890250
        - text: . También utilizamos estas cookies para comprender cómo utilizan los clientes nuestros servicios (por ejemplo, midiendo las visitas al sitio web) con el fin de poder realizar mejoras. Haz clic en «Rechazar» para rechazar o en «Personalizar» para elegir anuncios más detallados u obtener más información. Puedes cambiar de opinión cuando quieras. Para ello, ve a
        - link "Cookies y opciones de publicidad" [ref=f5e13] [cursor=pointer]:
          - /url: /privacyprefs/customize?oCT=ads&ref_=portal_banner_cpp
        - text: . Para obtener más información sobre cómo y con qué fines utiliza Amazon la información personal (como el historial de pedidos de la tienda o el historial de reproducciones de Prime Video) y las cookies o anuncios personalizados, consulta nuestro
        - link "Aviso de privacidad" [ref=f5e14] [cursor=pointer]:
          - /url: /gp/help/customer/display.html?nodeId=201909010
        - text: ", nuestro"
        - link "Aviso de cookies" [ref=f5e15] [cursor=pointer]:
          - /url: /gp/help/customer/display.html?nodeId=201890250
        - text: y nuestro
        - link "Aviso sobre publicidad basada en los intereses del usuario" [ref=f5e16] [cursor=pointer]:
          - /url: /gp/help/customer/display.html?nodeId=G64JFZVFDY66XG9K&ref_=footer_Interest_Based_Ads_Notice&language=en
        - text: .
      - paragraph [ref=f5e17]:
        - text: Como no has iniciado sesión, tu elección solo se aplicará a este dispositivo o este navegador. Cuando inicies sesión, recordaremos tus preferencias en todos tus dispositivos y navegadores y, si se detecta un conflicto entre las preferencias de tu cuenta y las elecciones que hiciste mientras navegabas sin haber iniciado sesión, se aplicarán las preferencias de tu cuenta. Puedes actualizar tus preferencias cuando quieras desde
        - link "Cookies y opciones de publicidad" [ref=f5e18] [cursor=pointer]:
