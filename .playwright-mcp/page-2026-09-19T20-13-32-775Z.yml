                - generic [ref=f12e351]:
                  - generic [ref=f12e352]:
                    - paragraph [ref=f12e353]: "Ubicación en el centro de Londres: NapCastle Caledonian Park en Londres ofrece una ubicación central, con el Teatro King's Cross a 1,8 km, el Estadio Emirates a 1,9 km y el Mercado de Camden a 2 km. El Aeropuerto de la Ciudad de Londres está a 16 km del establecimiento. Alojamientos cómodos: El hostal cuenta con un jardín y wifi gratuito. Cada habitación incluye un escritorio, baño compartido con artículos de aseo gratuitos y una zona de estar. Instalaciones y servicios convenientes: Los clientes se benefician de servicios de check-in y check-out privados, un salón y una cocina compartida. Otras ventajas incluyen una tetera y cafetera, vistas al jardín y vistas a una calle tranquila. Atracciones cercanas: Explora la Estación King's Cross a 3,2 km, el Museo Británico a 4,5 km y el Zoológico de Londres a 3,6 km del establecimiento."
                    - paragraph [ref=f12e354]: A las parejas les encanta la ubicación — Le han puesto un 8,3 para viajes de dos personas.
