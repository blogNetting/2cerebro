    - dialog "Gestionar la configuración de las cookies" [ref=f18e1871]:
      - generic [ref=f18e1873]:
        - generic [ref=f18e1875]:
          - heading "Gestionar la configuración de las cookies" [level=2] [ref=f18e1876]
          - generic [ref=f18e1877]:
            - paragraph [ref=f18e1878]: "Cuando utilizas Booking.com, nosotros (Booking.com y nuestros colaboradores) usamos las siguientes categorías de cookies (y tecnologías similares) que requieren tu consentimiento: cookies analíticas y cookies de marketing."
            - heading "Cookies analíticas" [level=3] [ref=f18e1879]
            - paragraph [ref=f18e1880]: Tanto nosotros como nuestros colaboradores usamos cookies analíticas para obtener información del uso que haces de nuestro servicio, lo que a su vez se utiliza para comprender la manera en que se usa nuestra plataforma y para mejorar el rendimiento de nuestro sitio y nuestros servicios.
            - heading "Cookies de marketing" [level=3] [ref=f18e1881]
            - paragraph [ref=f18e1882]: Nosotros y nuestros colaboradores utilizamos cookies de marketing, incluidas las de redes sociales, para recopilar información sobre tu comportamiento en esta plataforma, lo que nos ayuda a decidir qué productos mostrarte dentro y fuera de ella, y para mostrar contenido y anuncios personalizados en Booking.com y otras plataformas. El contenido personalizado se basa en tu comportamiento y en los servicios que hayas reservado. Estas cookies también te permiten compartir páginas en redes sociales o darles a "me gusta".
            - paragraph [ref=f18e1883]: Al seleccionar "Aceptar", das tu consentimiento para el uso de cookies analíticas y de marketing, así como para el correspondiente tratamiento de tus datos personales. Puedes actualizar tu consentimiento para cada plataforma en cualquier momento. En el sitio web, en "Gestionar la configuración de las cookies" en el pie de página; en la aplicación, en "Mi cuenta/Iniciar sesión" > "Preferencias del dispositivo" > "Gestionar ajustes de privacidad".
            - paragraph [ref=f18e1884]: Al seleccionar "Rechazar", tendrás una experiencia menos personalizada en nuestra plataforma.
            - paragraph [ref=f18e1885]:
              - text: Puedes encontrar más información sobre el correspondiente tratamiento de los datos personales en la
              - link "Política de privacidad" [ref=f18e1886] [cursor=pointer]:
                - /url: https://www.booking.com/content/privacy.html
              - text: .
